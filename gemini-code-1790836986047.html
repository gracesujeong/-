<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎙️ 라디오 리포터 대시보드</title>
    <style>
        :root { --bg: #f4f6f8; --card: #ffffff; --primary: #007aff; --text: #1c1c1e; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 20px; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #0056b3; }
        .item { border-bottom: 1px solid #eee; padding: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .item:last-child { border-bottom: none; }
        .badge { background: #e5f1ff; color: var(--primary); padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .del-btn { background: #ff3b30; width: auto; padding: 5px 10px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ 라디오 리포터 대시보드</h1>
        
        <div class="card">
            <h2>📝 새 일정 / 아이디어 입력</h2>
            <div class="form-group">
                <label>구분</label>
                <select id="category">
                    <option value="취재 일정">취재 일정</option>
                    <option value="방송 녹음">방송 녹음</option>
                    <option value="아이디어 창고">아이디어 창고</option>
                    <option value="할 일(ToDo)">할 일(ToDo)</option>
                </select>
            </div>
            <div class="form-group">
                <label>날짜 / 장소</label>
                <input type="text" id="meta" placeholder="예: 10월 10일 송도 재외동포 웰컴센터">
            </div>
            <div class="form-group">
                <label>내용 / 제목</label>
                <input type="text" id="title" placeholder="예: 한국어 말하기 취재 및 현장음 녹음">
            </div>
            <button onclick="addItem()">저장하기</button>
        </div>

        <div class="card">
            <h2>📋 저장된 항목 리스트</h2>
            <div id="itemList"></div>
        </div>
    </div>

    <script>
        function loadItems() {
            const items = JSON.parse(localStorage.getItem('reporter_data') || '[]');
            const listEl = document.getElementById('itemList');
            listEl.innerHTML = '';
            
            if (items.length === 0) {
                listEl.innerHTML = '<p style="color:#888; text-align:center;">저장된 일정이 없습니다.</p>';
                return;
            }

            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <div>
                        <span class="badge">${item.category}</span>
                        <strong style="display:block; margin-top:5px;">${item.title}</strong>
                        <small style="color:#666;">${item.meta}</small>
                    </div>
                    <button class="del-btn" onclick="deleteItem(${index})">삭제</button>
                `;
                listEl.appendChild(div);
            });
        }

        function addItem() {
            const category = document.getElementById('category').value;
            const meta = document.getElementById('meta').value;
            const title = document.getElementById('title').value;

            if (!title) { alert('내용을 입력해주세요!'); return; }

            const items = JSON.parse(localStorage.getItem('reporter_data') || '[]');
            items.unshift({ category, meta, title });
            localStorage.setItem('reporter_data', JSON.stringify(items));

            document.getElementById('meta').value = '';
            document.getElementById('title').value = '';
            loadItems();
        }

        function deleteItem(index) {
            const items = JSON.parse(localStorage.getItem('reporter_data') || '[]');
            items.splice(index, 1);
            localStorage.setItem('reporter_data', JSON.stringify(items));
            loadItems();
        }

        loadItems();
    </script>
</body>
</html>
