<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>라디오 리포터 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen pb-12 font-sans antialiased text-slate-800">

  <!-- 보안 기기 등록 화면 (최초 1회만 실행됨) -->
  <div id="login-modal" class="fixed inset-0 bg-slate-900/90 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center space-y-5 shadow-2xl">
      <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto text-2xl">
        🔐
      </div>
      <div>
        <h2 class="text-xl font-bold text-slate-800">전용 기기 등록</h2>
        <p class="text-xs text-slate-500 mt-1">최초 1회 인증 후에는 비밀번호 없이 바로 접속됩니다.</p>
      </div>
      <form id="login-form" class="space-y-4">
        <input type="password" id="pin-input" maxlength="10" placeholder="비밀번호 입력" class="w-full bg-slate-100 border border-slate-200 rounded-2xl p-3.5 text-center text-lg font-bold tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl transition-all text-sm">
          이 기기에서 자동 로그인 승인
        </button>
      </form>
    </div>
  </div>

  <!-- 대시보드 본문 -->
  <div id="app-content" class="hidden">
    <!-- 헤더 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
      <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
        <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
          <span>🎙️</span> 라디오 리포터 대시보드
        </h1>
        <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 승인된 기기 (실시간 연동)
        </span>
      </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-2xl mx-auto px-4 mt-6 space-y-6">

      <!-- 입력 폼 -->
      <section class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <h2 class="font-bold text-slate-700 flex items-center gap-2 text-base">
          <span>📝</span> 새 일정 / 아이디어 입력
        </h2>
        
        <form id="schedule-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">구분</label>
            <select id="category" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="취재 일정">취재 일정</option>
              <option value="아이디어 메모">아이디어 메모</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">날짜 / 장소</label>
            <input type="text" id="location" placeholder="예: 10월 10일 송도 재외동포 웰컴센터" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">내용 / 제목</label>
            <input type="text" id="title" required placeholder="예: 한국어 말하기 취재 및 현장음 녹음" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition-all text-sm flex items-center justify-center gap-2">
            <span>💾</span> 저장하기
          </button>
        </form>
      </section>

      <!-- 저장된 항목 리스트 -->
      <section class="space-y-3">
        <div class="flex items-center justify-between px-1">
          <h2 class="font-bold text-slate-700 flex items-center gap-2 text-base">
            <span>📋</span> 저장된 항목 리스트
          </h2>
          <span id="item-count" class="text-xs text-slate-400 font-medium">동기화 확인 중...</span>
        </div>

        <div id="item-list" class="space-y-3">
          <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400 text-sm">
            실시간 데이터를 불러오는 중입니다...
          </div>
        </div>
      </section>

    </main>
  </div>

  <script>
    // 💡 비밀번호: 1012
    const MY_SECRET_PIN = "1012";

    // 💡 안정적인 동기화 클라우드 API 엔드포인트
    const API_URL = "https://api.jsonbin.io/v3/b/66fa2eb5e41b4d34e4392683";

    const loginModal = document.getElementById('login-modal');
    const loginForm = document.getElementById('login-form');
    const pinInput = document.getElementById('pin-input');
    const appContent = document.getElementById('app-content');

    const form = document.getElementById('schedule-form');
    const itemList = document.getElementById('item-list');
    const itemCount = document.getElementById('item-count');
    const submitBtn = document.getElementById('submit-btn');

    let isSaving = false;

    // 기기 영구 인증 확인
    if (localStorage.getItem('my_device_authenticated') === 'true') {
      showApp();
    }

    // 로그인
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (pinInput.value === MY_SECRET_PIN) {
        localStorage.setItem('my_device_authenticated', 'true');
        showApp();
      } else {
        alert("비밀번호가 올바르지 않습니다.");
        pinInput.value = '';
      }
    });

    function showApp() {
      loginModal.classList.add('hidden');
      appContent.classList.remove('hidden');
      loadItems();
      setInterval(loadItems, 2000); // 2초마다 자동 동기화
    }

    // 데이터 불러오기
    async function loadItems() {
      if (isSaving) return;
      try {
        const res = await fetch(API_URL + "/latest", {
          headers: { "X-Bin-Meta": "false" }
        });
        if (!res.ok) return;
        const data = await res.json();
        renderList(Array.isArray(data) ? data : []);
      } catch (err) {
        console.error("동기화 오류:", err);
      }
    }

    // 화면 그리기
    function renderList(items) {
      itemCount.textContent = `총 ${items.length}개`;

      if (items.length === 0) {
        itemList.innerHTML = `
          <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400 text-sm">
            저장된 일정이나 메모가 없습니다.
          </div>
        `;
        return;
      }

      itemList.innerHTML = items.map((item, index) => `
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-start justify-between gap-4 hover:border-slate-300 transition-all">
          <div class="space-y-1.5 flex-1">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-xs px-2.5 py-0.5 rounded-full font-semibold ${
                item.category === '취재 일정' ? 'bg-indigo-100 text-indigo-700' : 'bg-amber-100 text-amber-700'
              }">${item.category || '기타'}</span>
              ${item.location ? `<span class="text-xs text-slate-500 font-medium"><i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${item.location}</span>` : ''}
            </div>
            <p class="font-semibold text-slate-800 text-base leading-snug">${item.title || '내용 없음'}</p>
            <p class="text-[11px] text-slate-400">${item.date || ''}</p>
          </div>
          <button onclick="deleteItem(${index})" class="text-slate-300 hover:text-rose-500 p-2 transition-colors" title="삭제">
            <i class="fa-solid fa-trash-can text-base"></i>
          </button>
        </div>
      `).join('');
    }

    // 저장하기
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const category = document.getElementById('category').value;
      const location = document.getElementById('location').value.trim();
      const title = document.getElementById('title').value.trim();

      if (!title) return;

      isSaving = true;
      submitBtn.disabled = true;
      submitBtn.innerText = "저장 중...";

      const now = new Date();
      const dateStr = `${now.getMonth() + 1}월 ${now.getDate()}일 ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

      try {
        let currentItems = [];
        const getRes = await fetch(API_URL + "/latest", { headers: { "X-Bin-Meta": "false" } });
        if (getRes.ok) {
          const fetched = await getRes.json();
          if (Array.isArray(fetched)) currentItems = fetched;
        }

        const newItem = { category, location, title, date: dateStr };
        currentItems.unshift(newItem);

        const putRes = await fetch(API_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(currentItems)
        });

        if (putRes.ok) {
          document.getElementById('location').value = '';
          document.getElementById('title').value = '';
          renderList(currentItems);
        } else {
          alert("저장 실패. 잠시 후 다시 시도해 주세요.");
        }
      } catch (err) {
        alert("네트워크 오류가 발생했습니다.");
      } finally {
        isSaving = false;
        submitBtn.disabled = false;
        submitBtn.innerText = "💾 저장하기";
      }
    });

    // 삭제하기
    async function deleteItem(indexToDelete) {
      if (!confirm('이 항목을 삭제하시겠습니까?')) return;
      isSaving = true;
      try {
        const getRes = await fetch(API_URL + "/latest", { headers: { "X-Bin-Meta": "false" } });
        if (getRes.ok) {
          let currentItems = await getRes.json();
          if (Array.isArray(currentItems)) {
            currentItems.splice(indexToDelete, 1);
            await fetch(API_URL, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(currentItems)
            });
            renderList(currentItems);
          }
        }
      } catch (err) {
        alert("삭제 실패");
      } finally {
        isSaving = false;
      }
    }
  </script>
</body>
</html>
