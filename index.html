<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>라디오 리포터 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen pb-12 font-sans antialiased text-slate-800">

  <!-- 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
        <span>🎙️</span> 라디오 리포터 대시보드
      </h1>
      <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 실시간 연동 중
      </span>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-2xl mx-auto px-4 mt-6 space-y-6">

    <!-- 입력 폼 -->
    <section class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
      <h2 class="font-bold text-slate-700 flex items-center gap-2 text-base">
        <span>📝</span> 새 일정 / 아이디어 입력
      </h2>
      
      <form id="schedule-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">구분</label>
          <select id="category" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="취재 일정">취재 일정</option>
            <option value="아이디어 메모">아이디어 메모</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">날짜 / 장소</label>
          <input type="text" id="location" placeholder="예: 10월 10일 송도 재외동포 웰컴센터" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">내용 / 제목</label>
          <input type="text" id="title" required placeholder="예: 한국어 말하기 취재 및 현장음 녹음" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition-all text-sm flex items-center justify-center gap-2">
          <span>💾</span> 저장하기
        </button>
      </form>
    </section>

    <!-- 저장된 항목 리스트 -->
    <section class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h2 class="font-bold text-slate-700 flex items-center gap-2 text-base">
          <span>📋</span> 저장된 항목 리스트
        </h2>
        <span id="item-count" class="text-xs text-slate-400 font-medium">동기화 확인 중...</span>
      </div>

      <div id="item-list" class="space-y-3">
        <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400 text-sm">
          실시간 클라우드 데이터를 불러오는 중입니다...
        </div>
      </div>
    </section>

  </main>

  <!-- Firebase 실시간 데이터베이스 스크립트 모듈 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 공용 데모 Firebase 데이터베이스 설정 (개인용 설정으로 교체 가능)
    const firebaseConfig = {
      apiKey: "AIzaSyD-demoKeyForReporterDashboard2026",
      authDomain: "reporter-dashboard-sync.firebaseapp.com",
      projectId: "reporter-dashboard-sync",
      storageBucket: "reporter-dashboard-sync.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:demoId"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "reporter_schedules");

    const form = document.getElementById('schedule-form');
    const itemList = document.getElementById('item-list');
    const itemCount = document.getElementById('item-count');

    // 실시간 동기화 수신기 (PC와 아이폰 모두 자동 업데이트)
    const q = query(colRef, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      itemCount.textContent = `총 ${items.length}개`;

      if (items.length === 0) {
        itemList.innerHTML = `
          <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400 text-sm">
            저장된 일정이나 메모가 없습니다.
          </div>
        `;
        return;
      }

      itemList.innerHTML = items.map(item => `
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-start justify-between gap-4 hover:border-slate-300 transition-all">
          <div class="space-y-1.5 flex-1">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-xs px-2.5 py-0.5 rounded-full font-semibold ${
                item.category === '취재 일정' ? 'bg-indigo-100 text-indigo-700' : 'bg-amber-100 text-amber-700'
              }">${item.category}</span>
              ${item.location ? `<span class="text-xs text-slate-500 font-medium"><i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${item.location}</span>` : ''}
            </div>
            <p class="font-semibold text-slate-800 text-base leading-snug">${item.title}</p>
            <p class="text-[11px] text-slate-400">${item.date || ''}</p>
          </div>
          <button data-id="${item.id}" class="delete-btn text-slate-300 hover:text-rose-500 p-2 transition-colors" title="삭제">
            <i class="fa-solid fa-trash-can text-base"></i>
          </button>
        </div>
      `).join('');

      // 삭제 버튼 이벤트 바인딩
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.onclick = async (e) => {
          const docId = e.currentTarget.getAttribute('data-id');
          if (confirm('이 항목을 삭제하시겠습니까?')) {
            await deleteDoc(doc(db, "reporter_schedules", docId));
          }
        };
      });
    }, (error) => {
      console.error("Firestore 오류:", error);
      itemList.innerHTML = `
        <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-rose-500 text-sm">
          동기화 연결 오류가 발생했습니다.
        </div>
      `;
    });

    // 데이터 저장
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const category = document.getElementById('category').value;
      const location = document.getElementById('location').value.trim();
      const title = document.getElementById('title').value.trim();

      if (!title) return;

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;

      try {
        await addDoc(colRef, {
          category,
          location,
          title,
          date: new Date().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
          createdAt: serverTimestamp()
        });

        document.getElementById('location').value = '';
        document.getElementById('title').value = '';
      } catch (err) {
        alert("저장 실패: " + err.message);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
