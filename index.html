<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>라디오 리포터 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen pb-12 font-sans antialiased text-slate-800">

  <!-- 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
        <span>🎙️</span> 라디오 리포터 대시보드
      </h1>
      <span id="sync-status" class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 실시간 서버 동기화 중
      </span>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-2xl mx-auto px-4 mt-6 space-y-6">

    <!-- 입력 폼 -->
    <section class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
      <h2 class="font-bold text-slate-700 flex items-center gap-2 text-base">
        <span>📝</span> 새 일정 / 아이디어 입력
      </h2>
      
      <form id="schedule-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">구분</label>
          <select id="category" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="취재 일정">취재 일정</option>
            <option value="아이디어 메모">아이디어 메모</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">날짜 / 장소</label>
          <input type="text" id="location" placeholder="예: 10월 10일 송도 재외동포 웰컴센터" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">내용 / 제목</label>
          <input type="text" id="title" required placeholder="예: 한국어 말하기 취재 및 현장음 녹음" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition-all text-sm flex items-center justify-center gap-2">
          <span>💾</span> 저장하기
        </button>
      </form>
    </section>

    <!-- 저장된 항목 리스트 -->
    <section class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h2 class="font-bold text-slate-700 flex items-center gap-2 text-base">
          <span>📋</span> 저장된 항목 리스트
        </h2>
        <span id="item-count" class="text-xs text-slate-400 font-medium">동기화 중...</span>
      </div>

      <div id="item-list" class="space-y-3">
        <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400 text-sm">
          서버에서 실시간 데이터를 불러오는 중입니다...
        </div>
      </div>
    </section>

  </main>

  <script>
    // 구글 Firebase Realtime Database 클라우드 전용 주소
    const DB_URL = "https://reporter-dashboard-sync-default-rtdb.firebaseio.com/schedules";

    const form = document.getElementById('schedule-form');
    const itemList = document.getElementById('item-list');
    const itemCount = document.getElementById('item-count');
    const submitBtn = document.getElementById('submit-btn');

    // 서버에서 데이터 불러오기 (PC/아이폰 완벽 동기화 및 F5 유지)
    async function fetchItems() {
      try {
        const res = await fetch(`${DB_URL}.json`);
        const data = await res.json();
        
        if (!data) {
          itemCount.textContent = "총 0개";
          itemList.innerHTML = `
            <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400 text-sm">
              저장된 일정이나 메모가 없습니다.
            </div>
          `;
          return;
        }

        const itemsArr = Object.keys(data).map(key => ({
          id: key,
          ...data[key]
        })).reverse(); // 최신순 정렬

        itemCount.textContent = `총 ${itemsArr.length}개`;

        itemList.innerHTML = itemsArr.map(item => `
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-start justify-between gap-4 hover:border-slate-300 transition-all">
            <div class="space-y-1.5 flex-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs px-2.5 py-0.5 rounded-full font-semibold ${
                  item.category === '취재 일정' ? 'bg-indigo-100 text-indigo-700' : 'bg-amber-100 text-amber-700'
                }">${item.category}</span>
                ${item.location ? `<span class="text-xs text-slate-500 font-medium"><i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${item.location}</span>` : ''}
              </div>
              <p class="font-semibold text-slate-800 text-base leading-snug">${item.title}</p>
              <p class="text-[11px] text-slate-400">${item.date}</p>
            </div>
            <button onclick="deleteItem('${item.id}')" class="text-slate-300 hover:text-rose-500 p-2 transition-colors" title="삭제">
              <i class="fa-solid fa-trash-can text-base"></i>
            </button>
          </div>
        `).join('');

      } catch (err) {
        console.error("데이터 동기화 에러:", err);
        itemList.innerHTML = `
          <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-rose-500 text-sm">
            서버 연결 오류가 발생했습니다. 잠시 후 다시 새로고침해 주세요.
          </div>
        `;
      }
    }

    // 서버에 데이터 추가
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const category = document.getElementById('category').value;
      const location = document.getElementById('location').value.trim();
      const title = document.getElementById('title').value.trim();

      if (!title) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>⏳</span> 저장 중...';

      const newItem = {
        category,
        location,
        title,
        date: new Date().toLocaleString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
        timestamp: Date.now()
      };

      try {
        await fetch(`${DB_URL}.json`, {
          method: 'POST',
          body: JSON.stringify(newItem),
          headers: { 'Content-Type': 'application/json' }
        });

        document.getElementById('location').value = '';
        document.getElementById('title').value = '';

        await fetchItems(); // 저장 즉시 리스트 갱신
      } catch (err) {
        alert("저장 중 오류가 발생했습니다.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>💾</span> 저장하기';
      }
    });

    // 서버 데이터 삭제
    async function deleteItem(id) {
      if (!confirm('이 항목을 삭제하시겠습니까?')) return;

      try {
        await fetch(`${DB_URL}/${id}.json`, {
          method: 'DELETE'
        });
        await fetchItems();
      } catch (err) {
        alert("삭제 중 오류가 발생했습니다.");
      }
    }

    // 화면이 켜지면 데이터 로드 & 3초마다 아이폰/PC 자동 실시간 동기화
    fetchItems();
    setInterval(fetchItems, 3000);
  </script>
</body>
</html>
