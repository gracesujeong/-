<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>라디오 리포터 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen pb-12 font-sans antialiased text-slate-800">

  <!-- 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
        <span>🎙️</span> 라디오 리포터 대시보드
      </h1>
      <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 안전 저장 중
      </span>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-2xl mx-auto px-4 mt-6 space-y-6">

    <!-- 입력 폼 -->
    <section class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
      <h2 class="font-bold text-slate-700 flex items-center gap-2 text-base">
        <span>📝</span> 새 일정 / 아이디어 입력
      </h2>
      
      <form id="schedule-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">구분</label>
          <select id="category" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="취재 일정">취재 일정</option>
            <option value="아이디어 메모">아이디어 메모</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">날짜 / 장소</label>
          <input type="text" id="location" placeholder="예: 10월 10일 송도 재외동포 웰컴센터" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">내용 / 제목</label>
          <input type="text" id="title" required placeholder="예: 한국어 말하기 취재 및 현장음 녹음" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition-all text-sm flex items-center justify-center gap-2">
          <span>💾</span> 저장하기
        </button>
      </form>
    </section>

    <!-- 저장된 항목 리스트 -->
    <section class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h2 class="font-bold text-slate-700 flex items-center gap-2 text-base">
          <span>📋</span> 저장된 항목 리스트
        </h2>
        <span id="item-count" class="text-xs text-slate-400 font-medium">총 0개</span>
      </div>

      <div id="item-list" class="space-y-3">
        <!-- 동적 삽입 영역 -->
      </div>
    </section>

  </main>

  <script>
    const form = document.getElementById('schedule-form');
    const itemList = document.getElementById('item-list');
    const itemCount = document.getElementById('item-count');

    // 로컬 데이터 불러오기 (undefined 완벽 해결 & F5 유지)
    function loadItems() {
      let items = [];
      try {
        items = JSON.parse(localStorage.getItem('reporter_data_v2') || '[]');
      } catch (e) {
        items = [];
      }

      itemCount.textContent = `총 ${items.length}개`;

      if (!items || items.length === 0) {
        itemList.innerHTML = `
          <div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400 text-sm">
            저장된 일정이나 메모가 없습니다.
          </div>
        `;
        return;
      }

      itemList.innerHTML = items.map((item, index) => {
        const category = item.category || '기타';
        const location = item.location || '';
        const title = item.title || '내용 없음';
        const date = item.date || '';

        return `
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-start justify-between gap-4 hover:border-slate-300 transition-all">
            <div class="space-y-1.5 flex-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs px-2.5 py-0.5 rounded-full font-semibold ${
                  category === '취재 일정' ? 'bg-indigo-100 text-indigo-700' : 'bg-amber-100 text-amber-700'
                }">${category}</span>
                ${location ? `<span class="text-xs text-slate-500 font-medium"><i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${location}</span>` : ''}
              </div>
              <p class="font-semibold text-slate-800 text-base leading-snug">${title}</p>
              <p class="text-[11px] text-slate-400">${date}</p>
            </div>
            <button onclick="deleteItem(${index})" class="text-slate-300 hover:text-rose-500 p-2 transition-colors" title="삭제">
              <i class="fa-solid fa-trash-can text-base"></i>
            </button>
          </div>
        `;
      }).join('');
    }

    // 데이터 저장
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const category = document.getElementById('category').value;
      const location = document.getElementById('location').value.trim();
      const title = document.getElementById('title').value.trim();

      if (!title) return;

      const items = JSON.parse(localStorage.getItem('reporter_data_v2') || '[]');
      
      const now = new Date();
      const dateStr = `${now.getMonth() + 1}월 ${now.getDate()}일 ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

      const newItem = {
        category: category,
        location: location,
        title: title,
        date: dateStr
      };

      items.unshift(newItem);
      localStorage.setItem('reporter_data_v2', JSON.stringify(items));

      document.getElementById('location').value = '';
      document.getElementById('title').value = '';

      loadItems();
    });

    // 데이터 삭제
    function deleteItem(index) {
      if (!confirm('이 항목을 삭제하시겠습니까?')) return;
      const items = JSON.parse(localStorage.getItem('reporter_data_v2') || '[]');
      items.splice(index, 1);
      localStorage.setItem('reporter_data_v2', JSON.stringify(items));
      loadItems();
    }

    // 처음 들어왔을 때 로드
    loadItems();
  </script>
</body>
</html>
